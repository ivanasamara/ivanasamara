<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ivana Samara | Links</title>
  
  <!-- Fonte Moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- Vue 3 -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  
  <style>
    :root {
      --bg: #0f0f1a;
      --card-bg: rgba(30, 30, 47, 0.6);
      --card-border: rgba(255, 255, 255, 0.1);
      --text: #ffffff;
      --text-muted: #b3b3b3;
      --accent: #ff4fd8;
      --accent-hover: #e03bc0;
      --shadow: rgba(0, 0, 0, 0.3);
    }

    body.light {
      --bg: #f0f2f5;
      --card-bg: rgba(255, 255, 255, 0.6);
      --card-border: rgba(0, 0, 0, 0.05);
      --text: #1a1a1a;
      --text-muted: #555555;
      --accent: #ff4fd8;
      --accent-hover: #e03bc0;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background 0.4s ease, color 0.4s ease;
      overflow-x: hidden;
      min-height: 100vh;
    }

    /* Tela de Splash (Bem-vindos) - Mantém a imagem original */
    .splash-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--bg);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1), visibility 1s;
    }

    .splash-screen.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-content {
      text-align: center;
      animation: popIn 1.5s cubic-bezier(0.25, 1, 0.5, 1) forwards;
    }

    .splash-img-wrapper {
      width: 180px;
      height: 180px;
      margin: 0 auto 25px auto;
      border-radius: 50%;
      padding: 5px;
      background: linear-gradient(45deg, var(--accent), #ff7eb3);
      box-shadow: 0 0 40px rgba(255, 79, 216, 0.4);
      animation: float 3s ease-in-out infinite;
    }

    .splash-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 20%;
      border-radius: 50%;
      border: 4px solid var(--bg);
    }

    .splash-text {
      font-size: 32px;
      font-weight: 700;
      color: var(--text);
      text-shadow: 0 0 15px rgba(255, 79, 216, 0.5);
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .splash-loader {
      width: 50px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      margin: 0 auto;
      border-radius: 2px;
      position: relative;
      overflow: hidden;
    }

    .splash-loader::after {
      content: '';
      position: absolute;
      left: -50%;
      top: 0;
      height: 100%;
      width: 50%;
      background: var(--accent);
      animation: loading 1.5s infinite linear;
    }

    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-15px); box-shadow: 0 15px 50px rgba(255, 79, 216, 0.6); }
      100% { transform: translateY(0px); }
    }

    @keyframes loading {
      0% { left: -50%; }
      100% { left: 100%; }
    }

    /* Efeitos de Partículas */
    .particles-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 9999;
      overflow: hidden;
    }
    .particle {
      position: absolute;
      top: -10%;
      font-size: 24px;
      animation: fall linear infinite;
      opacity: 0.8;
    }
    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* Layout Principal */
    .container {
      max-width: 800px;
      margin: auto;
      padding: 20px;
      position: relative;
      z-index: 10;
      padding-top: 60px; /* Ajustado para menu menor */
    }

    a {
      text-decoration: none;
      color: var(--text);
    }

    /* Menu de Configurações (Vidro) - MENU DIMINUÍDO */
    .config-panel {
      position: fixed;
      top: 10px; /* Levemente mais para baixo */
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      padding: 5px 15px; /* Padding reduzido */
      border-radius: 20px; /* Raio menor */
      display: flex;
      gap: 10px; /* Espaço menor entre itens */
      align-items: center;
      z-index: 100;
      box-shadow: 0 4px 15px var(--shadow);
    }

    .config-panel select, .config-panel button {
      background: transparent;
      border: 1px solid var(--text-muted);
      color: var(--text);
      padding: 3px 8px; /* Padding interno reduzido */
      border-radius: 10px;
      font-family: 'Poppins', sans-serif;
      font-size: 13px; /* Fonte menor */
      cursor: pointer;
      outline: none;
      transition: 0.3s;
    }
    
    .config-panel select:hover, .config-panel button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .config-panel select option {
      background: var(--bg);
      color: var(--text);
    }

    /* Banner de Perfil - AGORA COM VÍDEO */
    .banner {
      height: 750px; /* Reduzi um pouco a altura gigante de 700px para UX melhor, ajuste se quiser */
      border-radius: 25px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: flex-end;
      padding: 30px;
      box-shadow: 0 10px 30px var(--shadow);
      animation: fadeInUp 1s ease;
      background: #000; /* Fundo preto caso o vídeo falhe */
    }

    /* Container do Vídeo */
    .banner-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover; /* Garante que o vídeo cubra a área sem distorcer */
      z-index: 0;
      opacity: 0.8; /* Leve transparência para combinar com o tema escuro */
    }

    .banner::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 60%;
      background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
      z-index: 1; /* Acima do vídeo */
    }

    .banner-content {
      position: relative;
      z-index: 2; /* Acima da sombra */
      color: white;
    }

    .title { font-size: 36px; font-weight: 700; line-height: 1.2; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); }
    .subtitle { font-size: 16px; opacity: 0.9; font-weight: 300; }

    /* Botão Destaque */
    .bio-btn {
      display: block;
      text-align: center;
      background: linear-gradient(45deg, var(--accent), #ff7eb3);
      padding: 16px;
      border-radius: 20px;
      margin: 25px 0;
      color: #fff;
      font-weight: 600;
      font-size: 18px;
      box-shadow: 0 8px 20px rgba(255, 79, 216, 0.4);
      transition: all 0.3s ease;
      animation: pulseBtn 2s infinite;
    }

    .bio-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 25px rgba(255, 79, 216, 0.6);
    }

    /* Seções e Carrossel Automático */
    .section {
      margin-top: 40px;
      animation: fadeInUp 1s ease 0.2s both;
    }

    .section h2 {
      font-size: 20px;
      margin-bottom: 15px;
      padding-left: 5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .section h2::before {
      content: '';
      display: inline-block;
      width: 5px;
      height: 20px;
      background: var(--accent);
      border-radius: 5px;
    }

    /* Nova Estrutura de Carrossel Infinito */
    .carousel-wrapper {
      overflow: hidden;
      width: 100%;
      padding: 10px 0 20px 0;
      position: relative;
    }

    .carousel-track {
      display: flex;
      gap: 15px;
      width: max-content;
      /* A animação faz a trilha deslizar continuamente */
      animation: scrollTrack 20s linear infinite;
    }

    /* Pausa a animação quando o usuário passa o mouse ou o dedo por cima */
    .carousel-track:hover {
      animation-play-state: paused;
    }

    @keyframes scrollTrack {
      0% { transform: translateX(0); }
      /* Move exatamente 50% (uma volta completa dos itens originais) */
      100% { transform: translateX(calc(-50% - 7.5px)); }
    }

    .card {
      min-width: 200px;
      max-width: 200px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      padding: 15px;
      border-radius: 20px;
      text-align: center;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-10px);
      box-shadow: 0 10px 20px var(--shadow);
      border-color: var(--accent);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 15px;
    }

    .card h3 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
    }

    /* Banner WhatsApp */
    .whatsapp-banner {
      display: block;
      margin: 40px 0;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 10px 25px var(--shadow);
      transition: all 0.3s ease;
      animation: fadeInUp 1s ease 0.4s both;
    }

    .whatsapp-banner img {
      width: 100%;
      display: block;
      border-radius: 20px;
      transition: transform 0.5s ease;
    }

    .whatsapp-banner:hover {
      transform: scale(1.02);
      box-shadow: 0 15px 30px var(--shadow);
    }

    /* Redes Sociais Grid */
    .social-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
    }

    .social-card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      padding: 15px;
      border-radius: 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .social-card img {
      width: 24px;
      height: 24px;
    }

    .social-card:hover {
      background: var(--accent);
      color: white;
      transform: translateY(-5px);
      box-shadow: 0 8px 15px rgba(255, 79, 216, 0.3);
    }
    
    .social-card:hover img {
      filter: brightness(0) invert(1);
    }

    /* Container do Desconto */
.discount-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 20px;
  gap: 12px;
}

/* Label de 10% OFF chamativa */
.discount-label {
  background: linear-gradient(90deg, #ff8a00, #e52e71);
  color: white;
  padding: 6px 16px;
  border-radius: 20px;
  font-weight: bold;
  font-size: 14px;
  text-transform: uppercase;
  letter-spacing: 1px;
  box-shadow: 0 4px 15px rgba(229, 46, 113, 0.4);
}

/* Efeito de "Pulso" para chamar a atenção */
.pulse-effect {
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.05); }
  100% { transform: scale(1); }
}

/* Botão de Copiar */
.copy-btn {
  background-color: #ffffff;
  color: #333333;
  border: 2px dashed #e52e71;
  padding: 12px 24px;
  border-radius: 12px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
  transition: all 0.3s ease;
  width: 90%;
  max-width: 300px;
}

.copy-btn:hover {
  background-color: #fff0f5;
  transform: translateY(-2px);
  box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

    /* Footer */
    footer {
      text-align: center;
      margin-top: 60px;
      padding-bottom: 30px;
      font-size: 14px;
      color: var(--text-muted);
    }
    footer a {
      color: var(--accent);
      font-weight: bold;
    }

    /* Keyframes Extras */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulseBtn {
      0% { box-shadow: 0 0 0 0 rgba(255, 79, 216, 0.6); }
      70% { box-shadow: 0 0 0 15px rgba(255, 79, 216, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 79, 216, 0); }
    }

    @media (min-width: 768px) {
      .banner { height: 700px; } /* Altura um pouco maior no desktop */
      .title { font-size: 48px; }
      .container { padding-top: 80px; }
    }
  </style>
</head>

const { createApp } = Vue;

createApp({
  data() {
    return { 
      data, 
      theme: 'dark', 
      effect: 'none', // Opções: 'none', 'copa', 'saojoao', 'namorados', 'natal'
      particles: [],
      showSplash: true,
      isFadingOut: false,
      copyText: '📋 Copiar Código: UH4QZD35',
      code: 'UH4QZD35'
    }
  },
  computed: {
    infiniteProducts() {
      return [...this.data.products, ...this.data.products];
    },
    infiniteMoreProducts() {
      return [...this.data.moreProducts, ...this.data.moreProducts];
    },
    activeParticles() {
      if (this.effect === 'none') return [];
      
      const emojis = {
        saojoao: ['🔥', '🌽', '🌻', '🎆', '🎊'],
        namorados: ['❤️', '💖', '💕', '💘', '💌'],
        natal: ['❄️', '🎄', '🎁', '⭐', '⛄'],
        copa: ['⚽', '🏆', '🥅', '🇧🇷', '🎉']
      };

      const currentEmojis = emojis[this.effect];
      
      return this.particles.map(p => ({
        ...p,
        emoji: currentEmojis[Math.floor(Math.random() * currentEmojis.length)]
      }));
    }
  },
  methods: {
    copyDiscountCode() {
      navigator.clipboard.writeText(this.code).then(() => {
        this.copyText = '✅ Código Copiado!';
        // Retorna ao texto original após 2 segundos
        setTimeout(() => {
          this.copyText = '📋 Copiar Código: UH4QZD35';
        }, 2000);
      }).catch(err => {
        console.error('Falha ao copiar: ', err);
      });
    },
    toggleTheme() {
      this.theme = this.theme === 'dark' ? 'light' : 'dark';
      document.body.className = this.theme;
    },
    getSeasonalEffect() {
      const today = new Date();
      const month = today.getMonth() + 1;
      const day = today.getDate();
      const currentDate = (month * 100) + day;

      const periods = [
        { name: 'namorados', start: 601, end: 612 },
        { name: 'saojoao', start: 613, end: 630 },
        { name: 'copa', start: 611, end: 719 },
        { name: 'natal', start: 1201, end: 1231 },
      ];

      for (const period of periods) {
        if (currentDate >= period.start && currentDate <= period.end) {
          return period.name;
        }
      }

      return 'none';
    },
    generateParticles() {
      if (this.effect === 'none') return;

      const temp = [];
      for (let i = 0; i < 35; i++) {
        temp.push({
          id: i,
          left: Math.random() * 100, 
          delay: Math.random() * 5, 
          duration: 4 + Math.random() * 6, 
          size: 16 + Math.random() * 20 
        });
      }
      this.particles = temp;
    },
    initSplash() {
      setTimeout(() => {
        this.isFadingOut = true;
        setTimeout(() => {
          this.showSplash = false;
        }, 1000);
      }, 3500);
    }
  },
  mounted() { 
    document.body.className = this.theme;
    this.effect = this.getSeasonalEffect();
    this.generateParticles();
    this.initSplash();
  }
}).mount('#app')
</script>
